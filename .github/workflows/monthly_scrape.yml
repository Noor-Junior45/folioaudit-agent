name: Monthly AMC scrape

on:
  schedule:
    # 03:00 UTC on the 16th of every month (= 08:30 IST on 16th).
    # SEBI mandates AMCs publish by the 15th, so the 16th gives a full
    # day buffer to ensure all files are live before we try to fetch them.
    - cron: "0 3 16 * *"
  workflow_dispatch: {}  # allows manual "Run workflow" button in GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one AMC failing shouldn't stop the others
      matrix:
        amc:
          - sbi
          - icici_pru
          - hdfc
          - nippon_india
          - kotak
          - aditya_birla
          - uti
          - axis
          - mirae_asset
          - dsp
          - whiteoak
          - motilal_oswal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent for ${{ matrix.amc }}
        continue-on-error: true   # a 404/download failure on one AMC won't fail the whole run
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # free at ai.google.dev
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional fallback
        run: python -m src.main --amc ${{ matrix.amc }}
